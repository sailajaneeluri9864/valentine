<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Valentine 💖</title>
.emoji-gif {
  width: 300px;
  height: 350px;
  object-
  max-width: 100vw;
}
 
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

<link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
 
body {
  background: #ffffff;
  overflow: hidden;
}
 
/* ---------- START SCREEN ---------- */
#start {
  height: 100vh;
  width: 100vw;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  overflow: hidden;
}
 
#emoji {
  width: 120px;
  margin-bottom: 20px;
}
 
h1 {
  font-size: 1.5rem;
  margin-bottom: 20px;
}
 
/* ---------- BUTTONS ---------- */
.buttons {
  position: relative;
  width: 200px;
  height: 100px;
}
 
button {
  padding: 12px 24px;
  font-size: 1.1rem;
  border: none;
  border-radius: 30px;
  cursor: pointer;
  position: absolute;
}
 
#yesBtn {
  background: #ff4d6d;
  color: white;
  left: 0;
  bottom: 0;
}
 
#noBtn {
  background: #ddd;
  color: #333;
  right: 0;
  bottom: 0;
}
 
/* ---------- VIDEO SCREEN ---------- */
#videoScreen {
  display: none;
  height: 100vh;
  width: 100vw;
  position: fixed;
  top: 0;
  left: 0;
}

video {
  width: 100%;
  height: 100%;
 object-fit: contain;

}
 
/* ---------- CONFETTI ---------- */
.confetti {
  position: fixed;
  top: -10px;
  width: 10px;
  height: 10px;
  background-color: red;

}
 
@keyframes fall {
  to {
    transform: translateY(110vh) rotate(360deg);
  }
}
 
/* ---------- MOBILE OPTIMIZATION ---------- */
@media (max-width: 600px) {
  h1 {
    font-size: 1.4rem;
  }
  #emoji {
    width: 100px;
  }
}
</style>
</head>
 
<body>
 
<!-- START SCREEN -->
<div id="start">
  <!-- Emoji GIF / PNG (transparent works best) -->
  <img id="emoji" src="emoji.gif" class="emoji-gif" alt="emoji">
 
  <h1 style= "font-family:'Pacifico', cursive; font-size: 25px">Will you be my Valentine? 🥰</h1>
  

<h2 style="font-family: 'Pacifico', cursive; color: #E0115F; font-size: 30px; font-weight: bold; font-style: italic;">

  Krishna💖
</h2>



 
  <div class="buttons">
    <button id="yesBtn">Yes 😍</button>
    <button id="noBtn">No 🤭</button>
  </div>
</div>
 
<!-- VIDEO SCREEN -->
<div id="videoScreen">
  <video id="proposalVideo" loop muted playsinline preload="auto">
    <source src="proposal.mp4" type="video/mp4">
  </video>
</div>
 
<script>
const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");
const start = document.getElementById("start");
const videoScreen = document.getElementById("videoScreen");
const video = document.getElementById("proposalVideo");
 
/* Naughty NO button */
noBtn.addEventListener("mouseover", () => {
  const x = Math.random() * 250;
  const y = Math.random() * 100;
  noBtn.style.transform = `translate(${x}px, ${y}px)`;
}); 


 
/* YES button click */
yesBtn.addEventListener("click", () => {
  start.style.display = "none";
  videoScreen.style.display = "block";
  video.muted = false;   // music allowed after click
  video.currentTime=0;
  video.play();
  startConfetti();
});
 
/* Confetti */
function startConfetti() {
  for (let i = 0; i < 40; i++) {
    const confetti = document.createElement("div");
    confetti.classList.add("confetti");
    confetti.style.left = Math.random() * 100 + "vw";
    confetti.style.backgroundColor =
      ["#ff4d6d", "#ffd166", "#06d6a0", "#118ab2"][Math.floor(Math.random() * 4)];
    confetti.style.animationDuration = (Math.random() * 2 + 2) + "s";
    document.body.appendChild(confetti);
 
    setTimeout(() => confetti.remove(), 4000);
  }
}
</script>
 
</body>

</html>
